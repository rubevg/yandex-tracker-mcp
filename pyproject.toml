[project]
name = "yandex-tracker-mcp"
version = "0.2.0"
description = "Independent MCP server for Yandex Tracker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "rubevg" }]
dependencies = [
    "aiohttp>=3.12,<3.14",
    "mcp>=1.20,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
yandex-tracker-mcp = "yandex_tracker_mcp.__main__:main"

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex_tracker_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["yandex_tracker_mcp"]
